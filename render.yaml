services:
  # Render Blueprint schema: a static site is declared as type "web" with
  # runtime "static" (see https://render.com/docs/blueprint-spec).
  # The previous form used the non-schema service type name and omitted
  # runtime, so the headers block below was never applied to the live site.
  - type: web
    name: dotitao-moments
    runtime: static
    buildCommand: npm ci && npm ci --prefix frontend && npm run build:public
    staticPublishPath: public
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
