name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run real YouTube and deployed production verification
        required: false
        type: boolean
        default: false

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    # automation/update-vods PRs use workflow-provided tokens that cannot
    # see pending-approval runs on this workflow (see docs/OPERATIONS.md);
    # those PRs verify via explicit workflow_dispatch instead, so skip the
    # automatic pull_request run here to avoid a permanently red check.
    if: github.event_name != 'pull_request' || github.head_ref != 'automation/update-vods'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: npm run setup

      - name: Install root Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install frontend Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run canonical verification
        run: npm run verify

      - name: Upload verification failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-failure
          path: |
            test-results/
            playwright-report/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  production-mobile-playback:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_live == true)
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LIVE_BASE_URL: https://dotitao-moments.onrender.com

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: npm run setup

      - name: Install root Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production publish directory
        run: npm run build:public

      - name: Verify real YouTube and deployed production
        run: npm run verify:live

      - name: Record successful production verification
        shell: bash
        run: |
          set -euo pipefail
          verification_branch="automation/production-verification"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          blob_sha="$(git hash-object -w production-verification.json)"
          tree_sha="$(printf '100644 blob %s\tproduction-verification.json\n' "$blob_sha" | git mktree)"
          parent_sha="$(git ls-remote origin "refs/heads/$verification_branch" | awk '{print $1}')"

          if [[ -n "$parent_sha" ]]; then
            git fetch --no-tags --depth=1 origin "refs/heads/$verification_branch"
            marker_commit="$(printf 'Record successful production verification for %s\n' "$GITHUB_SHA" | git commit-tree "$tree_sha" -p "$parent_sha")"
          else
            marker_commit="$(printf 'Record successful production verification for %s\n' "$GITHUB_SHA" | git commit-tree "$tree_sha")"
          fi

          git push --force origin "$marker_commit:refs/heads/$verification_branch"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-mobile-playback-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
