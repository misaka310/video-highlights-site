# managed-by: repo-launch-doctor-public-guard-v1
name: Repo Launch Doctor

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-launch-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  doctor:
    name: public-readiness
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out target repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: target
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Publish pending readiness status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_SHA: ${{ github.sha }}
        run: python target/.github/scripts/publish_status.py pending "Repo Launch Doctor is running"

      - name: Check out Repo Launch Doctor
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: misaka310/repo-launch-doctor
          ref: 976cc69ffdc9b2df446840f5afdfcfe9197151f8
          path: doctor

      - name: Scan current repository state
        working-directory: doctor
        run: >-
          python -m repo_launch_doctor scan ../target
          --output "${{ runner.temp }}/repo-launch-doctor/current"
          --fail-on high

      - name: Scan pull request commit history
        if: github.event_name == 'pull_request'
        working-directory: doctor
        run: >-
          python -m repo_launch_doctor history-scan ../target
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          --output "${{ runner.temp }}/repo-launch-doctor/history"

      - name: Scan full history on manual run
        if: github.event_name == 'workflow_dispatch'
        working-directory: doctor
        run: >-
          python -m repo_launch_doctor history-scan ../target
          --all-history
          --output "${{ runner.temp }}/repo-launch-doctor/history"

      - name: Upload Repo Launch Doctor reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repo-launch-doctor-report
          path: ${{ runner.temp }}/repo-launch-doctor
          if-no-files-found: warn
          retention-days: 7

      - name: Publish successful readiness status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_SHA: ${{ github.sha }}
        run: python target/.github/scripts/publish_status.py success "Repo Launch Doctor passed"
