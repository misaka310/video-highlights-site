name: Public trailer smoke

on:
  push:
    branches:
      - main
    paths:
      - data/produced_videos.json
      - frontend/public/media/dotitao-trailer/master.m3u8
      - scripts/check_public_trailer.py
      - .github/workflows/public-trailer-smoke.yml
  pull_request:
    paths:
      - data/produced_videos.json
      - frontend/public/media/dotitao-trailer/master.m3u8
      - scripts/check_public_trailer.py
      - .github/workflows/public-trailer-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Verify live trailer and HLS playback assets
        run: python scripts/check_public_trailer.py
