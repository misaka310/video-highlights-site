name: Publish release branch

on:
  push:
    branches:
      - "release/**"

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Create checked pull request and merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/checked_pr_merge.py \
            --branch "$GITHUB_REF_NAME" \
            --head-sha "$GITHUB_SHA" \
            --title "Publish Kumo frontend" \
            --body "Publish the reviewed Kumo frontend through the required public-readiness check." \
            --workflow-mode trusted-dispatch \
            --merge-attempts 12
