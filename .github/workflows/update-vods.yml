name: Update VOD data

concurrency:
  group: update-vod-data
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-vods.yml"
      - "requirements-transcribe.txt"
      - "scripts/headline_*.py"
      - "scripts/transcribe_segments.py"
      - "scripts/transcript_*.py"
      - "scripts/transcription/**"
      - "scripts/verify_public_enrichment.py"
  schedule:
    # Start at 06:07 JST so the public data is normally ready by 09:00 JST.
    # GitHub Actions cron is evaluated in UTC.
    - cron: "7 21 * * *"
  workflow_dispatch:
    inputs:
      force_refresh_transcripts:
        description: Force re-transcribe and regenerate headlines
        required: false
        default: "false"
      skip_segment_transcription:
        description: Skip headline and screenshot generation
        required: false
        default: "false"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-vods:
    # Temporary subscriber-only maintenance: automatic push/schedule events remain
    # declared for compatibility checks, but only manual dispatch may run the job.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Asia/Tokyo
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_CHANNEL: ${{ vars.TWITCH_CHANNEL }}
      TWITCH_CHANNEL_ID: ${{ vars.TWITCH_CHANNEL_ID }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      SITE_LANGUAGE: ${{ vars.SITE_LANGUAGE }}
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      TWITCH_LIVE_CHECK_ENABLED: "1"
      TWITCH_LIVE_CHECK_FAIL_OPEN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install TwitchDownloaderCLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-tools/twitchdownloader
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/lay295/TwitchDownloader/releases/download/1.56.4/TwitchDownloaderCLI-1.56.4-Linux-x64.zip" \
            --output .tmp-tools/twitchdownloader/td.zip
          echo '5b52964764e6e6c704f9d3b5aaaeb02f78c7c91a57b1bf9b2636738da293af89  .tmp-tools/twitchdownloader/td.zip' | sha256sum --check --strict
          unzip -o .tmp-tools/twitchdownloader/td.zip -d .tmp-tools/twitchdownloader
          chmod +x .tmp-tools/twitchdownloader/TwitchDownloaderCLI
          echo "TWITCHDOWNLOADER_BIN=$GITHUB_WORKSPACE/.tmp-tools/twitchdownloader/TwitchDownloaderCLI" >> "$GITHUB_ENV"

      - name: Update VOD data
        run: python scripts/update_vods.py

      - name: Install ffmpeg
        if: ${{ github.event.inputs.skip_segment_transcription != 'true' }}
        timeout-minutes: 5
        uses: AnimMouse/setup-ffmpeg@2afa535ca6e6bc550066c82457d987656876d248

      - name: Install transcription dependencies
        if: ${{ github.event.inputs.skip_segment_transcription != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-transcribe.txt

      - name: Verify faster_whisper import
        if: ${{ github.event.inputs.skip_segment_transcription != 'true' }}
        run: python -c "import faster_whisper; print('faster_whisper import ok')"

      - name: Generate highlight headlines and screenshots
        if: ${{ github.event.inputs.skip_segment_transcription != 'true' }}
        env:
          TRANSCRIPT_MODEL: large-v3-turbo
          TRANSCRIPT_BEAM_SIZE: 3
          TRANSCRIPT_CONDITION_ON_PREVIOUS_TEXT: false
          TRANSCRIPT_VAD_FILTER: true
          TRANSCRIPT_VAD_MIN_SILENCE_DURATION_MS: 2000
          TRANSCRIPT_MAX_SEGMENTS: 9
          TRANSCRIPT_RETRY_ERRORS: 1
          FORCE_TRANSCRIPT_REFRESH: ${{ github.event_name == 'push' && 'true' || github.event.inputs.force_refresh_transcripts || 'false' }}
          FORCE_HEADLINE_REFRESH: ${{ github.event_name == 'push' && 'true' || github.event.inputs.force_refresh_transcripts || 'false' }}
          TRANSCRIPT_MAX_DURATION_SEC: 150
          GEMINI_API_KEY: ""
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.6-27b
          NVIDIA_API_KEY: ""
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_API_URL: ${{ vars.NVIDIA_API_URL }}
          HEADLINE_MAX_CHARS: 28
          TRANSCRIPT_SECOND_PASS_TOP_N: 3
          SEGMENT_SCREENSHOT_GENERATION_ENABLED: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/transcribe_segments.py --print-headline-results | tee headline-generation.log

      - name: Build headline diagnostics
        if: ${{ always() && github.event.inputs.skip_segment_transcription != 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("headline-generation.log")
          output = Path("headline-diagnostics.txt")
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines() if source.exists() else []
          blocks = []
          current = []
          collecting = False
          for line in lines:
              if line.startswith("headline-result "):
                  if current:
                      blocks.append("\n".join(current))
                  current = [line]
                  collecting = True
                  continue
              if collecting:
                  current.append(line)
                  if line.startswith("--------------------------------------------------------"):
                      blocks.append("\n".join(current))
                      current = []
                      collecting = False
          if current:
              blocks.append("\n".join(current))
          output.write_text("\n\n".join(blocks) + ("\n" if blocks else ""), encoding="utf-8")
          print(f"headline diagnostic blocks={len(blocks)} path={output}")
          PY

      - name: Upload headline diagnostics
        if: ${{ always() && github.event.inputs.skip_segment_transcription != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: headline-diagnostics-${{ github.run_id }}
          path: headline-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Verify public enrichment
        if: ${{ github.event.inputs.skip_segment_transcription != 'true' }}
        run: python scripts/verify_public_enrichment.py

      - name: Verify no raw chat retention
        run: python -m unittest tests.test_privacy_retention -v

      - name: Publish updated data through a checked pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          diff_targets=(data/processed_vods.json data/vods.json data/vod_index.json data/vods data/segment-thumbnails)
          automation_branch="automation/update-vods"
          pr_title="Update Twitch VOD data"
          pr_body="Automated VOD data refresh. The update is merged only after the required public-readiness check passes."

          if git diff --quiet -- "${diff_targets[@]}"; then
            echo "No data changes to publish."
            exit 0
          fi

          git add -A -- "${diff_targets[@]}"
          git commit -m "$pr_title"

          for publish_attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git diff --quiet origin/main -- "${diff_targets[@]}"; then
              echo "The generated data is already present on main."
              exit 0
            fi

            head_sha="$(git rev-parse HEAD)"
            expected_main_sha="$(git rev-parse origin/main)"
            git push --force origin "HEAD:refs/heads/$automation_branch"

            if python .github/scripts/checked_pr_merge.py \
              --branch "$automation_branch" \
              --head-sha "$head_sha" \
              --title "$pr_title" \
              --body "$pr_body" \
              --expected-base-sha "$expected_main_sha" \
              --workflow-mode trusted-dispatch \
              --merge-attempts 6; then
              exit 0
            else
              status=$?
            fi

            if [[ "$status" -ne 75 ]]; then
              exit "$status"
            fi
            echo "Publish attempt $publish_attempt needs a rebase; retrying from current main."
          done

          echo "Unable to merge the automated VOD update after 3 checked attempts." >&2
          exit 1
